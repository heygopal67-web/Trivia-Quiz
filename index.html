<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trivia Quiz</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <!-- Theme Toggle -->
    <div class="theme-toggle">
      <button id="themeToggle" class="theme-btn">
        <i class="fas fa-moon"></i>
      </button>
    </div>

    <!-- Start Screen -->
    <div id="startScreen" class="screen active">
      <div class="container">
        <div class="card">
          <h1 class="title">🎯 Trivia Quiz</h1>
          <p class="subtitle">Test your knowledge across various categories!</p>

          <form id="startForm" class="start-form">
            <div class="input-group">
              <label for="playerName">Your Name</label>
              <input
                type="text"
                id="playerName"
                required
                placeholder="Enter your name"
              />
            </div>

            <div class="input-group">
              <label for="category">Category</label>
              <select id="category" required>
                <option value="">Select a category</option>
                <option value="general">General Knowledge</option>
                <option value="sports">Sports</option>
                <option value="movies">Movies</option>
                <option value="science">Science</option>
              </select>
            </div>

            <div class="input-group">
              <label for="difficulty">Difficulty</label>
              <select id="difficulty" required>
                <option value="">Select difficulty</option>
                <option value="easy">Easy</option>
                <option value="medium">Medium</option>
                <option value="hard">Hard</option>
              </select>
            </div>

            <button type="submit" class="btn btn-primary">
              <i class="fas fa-play"></i>
              Start Quiz
            </button>
          </form>
        </div>
      </div>
    </div>

    <!-- Quiz Screen -->
    <div id="quizScreen" class="screen">
      <div class="container">
        <div class="quiz-header">
          <div class="player-info">
            <span id="playerNameDisplay"></span>
            <span class="score">Score: <span id="currentScore">0</span></span>
          </div>
          <div class="quiz-stats">
            <div class="progress-container">
              <div class="progress-bar">
                <div id="progressFill" class="progress-fill"></div>
              </div>
              <span id="questionCounter">1/10</span>
            </div>
            <div class="timer-container">
              <div class="timer">
                <i class="fas fa-clock"></i>
                <span id="timer">30</span>s
              </div>
            </div>
          </div>
        </div>

        <div class="question-card">
          <h2 id="questionText" class="question-text"></h2>

          <div id="optionsContainer" class="options-container">
            <!-- Options will be dynamically generated -->
          </div>

          <div class="feedback-container" id="feedbackContainer">
            <div id="feedbackText" class="feedback-text"></div>
            <div id="explanation" class="explanation"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- End Screen -->
    <div id="endScreen" class="screen">
      <div class="container">
        <div class="card">
          <div id="celebration" class="celebration hidden">
            <i class="fas fa-trophy"></i>
            <h2>New High Score! 🎉</h2>
          </div>

          <h1 class="title">Quiz Complete!</h1>

          <div class="results">
            <div class="result-item">
              <i class="fas fa-star"></i>
              <span>Final Score: <strong id="finalScore">0</strong></span>
            </div>
            <div class="result-item">
              <i class="fas fa-percentage"></i>
              <span>Accuracy: <strong id="accuracy">0%</strong></span>
            </div>
            <div class="result-item">
              <i class="fas fa-bolt"></i>
              <span
                >Fastest Answer: <strong id="fastestAnswer">0s</strong></span
              >
            </div>
            <div class="result-item">
              <i class="fas fa-fire"></i>
              <span>Best Streak: <strong id="bestStreak">0</strong></span>
            </div>
          </div>

          <div class="action-buttons">
            <button id="playAgainBtn" class="btn btn-primary">
              <i class="fas fa-redo"></i>
              Play Again
            </button>
            <button id="shareScoreBtn" class="btn btn-secondary">
              <i class="fab fa-twitter"></i>
              Share Score
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
